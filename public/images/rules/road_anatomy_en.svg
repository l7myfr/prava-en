" stroke-width="3" stroke-dasharray="8 6"/><path d="M290,384 L304,340" fill="none" stroke="#E0A100" stroke-width="2.5" marker-end="url(#ak)"/><text x="286" y="396" font-size="15" font-weight="bold" text-anchor="end" fill="#9A6F00">Intersection</text><path d="M482,84 L494,84" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="500" y="78" font-size="14" font-weight="bold" text-anchor="start" fill="#1F2328">Leaving it:</text><text x="500" y="97" font-size="14" font-weight="bold" text-anchor="start" fill="#D64545">give way to everyone</text><path d="M482,122 L494,121" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="500" y="126" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Sidewalk</text><path d="M482,139 L494,147" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="500" y="152" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Shoulder</text><path d="M482,150 L490,150 L490,222 L482,222" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="500" y="191" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Carriageway</text><path d="M482,256 L490,256 L490,328 L482,328" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="500" y="297" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Carriageway</text><path d="M482,239 L494,239" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="500" y="244" font-size="14" font-weight="bold" text-anchor="start" fill="#2E9E5B">no driving on it</text><path d="M482,339 L494,336" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="500" y="341" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Shoulder</text><path d="M482,356 L494,362" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="500" y="367" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Sidewalk</text><text x="24" y="434" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Road = sidewalks + shoulders + carriageways + dividing strip</text><text x="24" y="458" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">With a dividing strip the road has two carriageways.</text><text x="24" y="480" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">Everything left of the strip is the opposite-direction side.</text></svg>