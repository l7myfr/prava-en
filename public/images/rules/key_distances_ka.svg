<svg xmlns="http://www.w3.org/2000/svg" width="700" height="620" viewBox="0 0 700 620" font-family="Segoe UI, Sylfaen, Noto Sans Georgian, DejaVu Sans, sans-serif"><defs>
<marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E5B"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F4F4F4"/></marker>
</defs><rect x="1" y="1" width="698" height="618" rx="14" fill="#FAFAF7" stroke="#D9D9D2" stroke-width="2"/><text x="24" y="36" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2328">მთავარი მანძილები</text><rect x="24" y="56" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="24" y="56" width="8" height="84" rx="4" fill="#D64545"/><text x="46" y="88" font-size="22" font-weight="bold" text-anchor="start" fill="#D64545">5 მ</text><text x="46" y="112" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">გაჩერება აკრძალულია</text><text x="46" y="131" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">გადასასვლელთან / გზაჯვარედინთან</text><rect x="358" y="56" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="358" y="56" width="8" height="84" rx="4" fill="#D64545"/><text x="380" y="88" font-size="22" font-weight="bold" text-anchor="start" fill="#D64545">15 მ</text><text x="380" y="112" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">გაჩერება აკრძალულია ავტობუსის,</text><text x="380" y="131" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">ტრამვაის, ტაქსის გაჩერებასთან</text><rect x="24" y="148" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="24" y="148" width="8" height="84" rx="4" fill="#E0A100"/><text x="46" y="180" font-size="22" font-weight="bold" text-anchor="start" fill="#B88400">50 მ</text><text x="46" y="204" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">დგომა აკრძალულია რკინიგზის</text><text x="46" y="223" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">გადასასვლელთან</text><rect x="358" y="148" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="358" y="148" width="8" height="84" rx="4" fill="#E0A100"/><text x="380" y="180" font-size="22" font-weight="bold" text-anchor="start" fill="#B88400">100 მ</text><text x="380" y="204" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">გასწრება აკრძალულია რკინიგზის</text><text x="380" y="223" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">გადასასვლელის წინ</text><rect x="24" y="240" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="24" y="240" width="8" height="84" rx="4" fill="#E0A100"/><text x="46" y="272" font-size="22" font-weight="bold" text-anchor="start" fill="#B88400">≥ 5 მ</text><text x="46" y="296" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">გაჩერდი დაკეტილ</text><text x="46" y="315" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">(ნახევარ)შლაგბაუმამდე</text><rect x="358" y="240" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="358" y="240" width="8" height="84" rx="4" fill="#2F6FDB"/><text x="380" y="272" font-size="22" font-weight="bold" text-anchor="start" fill="#2F6FDB">&lt; 300 მ</text><text x="380" y="296" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">არასაკმარისი ხილვადობა</text><rect x="24" y="332" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="24" y="332" width="8" height="84" rx="4" fill="#2F6FDB"/><text x="46" y="364" font-size="22" font-weight="bold" text-anchor="start" fill="#2F6FDB">100 მ</text><text x="46" y="388" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">მობრუნება აკრძალულია, თუ</text><text x="46" y="407" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">ხილვადობა ამაზე ნაკლებია</text><rect x="358" y="332" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="358" y="332" width="8" height="84" rx="4" fill="#2F6FDB"/><text x="380" y="364" font-size="22" font-weight="bold" text-anchor="start" fill="#2F6FDB">150 მ</text><text x="380" y="388" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">შორი ფარის ახლოზე გადართვა</text><text x="380" y="407" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">შემხვედრამდე</text><rect x="24" y="424" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="24" y="424" width="8" height="84" rx="4" fill="#2E9E5B"/><text x="46" y="456" font-size="22" font-weight="bold" text-anchor="start" fill="#2E9E5B">15 მ / 30 მ</text><text x="46" y="480" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">საავარიო ნიშანი: დასახლებული /</text><text x="46" y="499" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">დაუსახლებელი</text><rect x="358" y="424" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="358" y="424" width="8" height="84" rx="4" fill="#2E9E5B"/><text x="380" y="456" font-size="22" font-weight="bold" text-anchor="start" fill="#2E9E5B">150–300 მ / 50–100 მ</text><text x="380" y="480" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">მაფრთხილებელი ნიშანი საფრთხემდე:</text><text x="380" y="499" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">დაუსახლებელი / დასახლებული</text><rect x="24" y="516" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="24" y="516" width="8" height="84" rx="4" fill="#2E9E5B"/><text x="46" y="548" font-size="22" font-weight="bold" text-anchor="start" fill="#2E9E5B">≥ 50 მ</text><text x="46" y="572" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">განმეორებითი მაფრთხილებელი</text><text x="46" y="591" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">ნიშანი, საფრთხემდე</text><rect x="358" y="516" width="318" height="84" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="358" y="516" width="8" height="84" rx="4" fill="#8A8F98"/><text x="380" y="548" font-size="22" font-weight="bold" text-anchor="start" fill="#5E646E">4–6 მ / ≤ 4 მ</text><text x="380" y="572" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">თოკით / ხისტი ბუქსირება</text></svg>