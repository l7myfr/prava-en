<svg xmlns="http://www.w3.org/2000/svg" width="700" height="548" viewBox="0 0 700 548" font-family="Segoe UI, Sylfaen, Noto Sans Georgian, DejaVu Sans, sans-serif"><defs>
<marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E5B"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker>
</defs><rect x="1" y="1" width="698" height="546" rx="14" fill="#FAFAF7" stroke="#D9D9D2" stroke-width="2"/><text x="24" y="36" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2328">After an accident: step by step</text><rect x="24" y="56" width="210" height="180" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="46" cy="78" r="13" fill="#E0A100"/><text x="46" y="83" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text><rect x="79" y="96" width="46" height="24" rx="5" fill="#2F6FDB" stroke="#fff" stroke-width="1.5"/><path d="M133,108 L175,108" stroke="#8A8F98" stroke-width="4" marker-end="url(#ak)"/><line x1="141" y1="92" x2="167" y2="124" stroke="#D64545" stroke-width="5" stroke-linecap="round"/><text x="129" y="168" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">Stop at once,</text><text x="129" y="187" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">don't move the car</text><rect x="245" y="56" width="210" height="180" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="267" cy="78" r="13" fill="#E0A100"/><text x="267" y="83" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text><rect x="257" y="88" width="186" height="40" rx="6" fill="#5E646E"/><rect x="391" y="96" width="46" height="24" rx="5" fill="#2F6FDB" stroke="#fff" stroke-width="1.5"/><circle cx="391" cy="96" r="5" fill="#E0A100" stroke="#fff" stroke-width="1"/><circle cx="391" cy="120" r="5" fill="#E0A100" stroke="#fff" stroke-width="1"/><circle cx="437" cy="96" r="5" fill="#E0A100" stroke="#fff" stroke-width="1"/><circle cx="437" cy="120" r="5" fill="#E0A100" stroke="#fff" stroke-width="1"/><polygon points="269,120 283,94 297,120" fill="#fff" stroke="#D64545" stroke-width="3.5"/><line x1="303" y1="108" x2="385" y2="108" stroke="#F4F4F4" stroke-width="1.5" marker-start="url(#ak)" marker-end="url(#ak)"/><text x="350" y="168" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">Hazard lights on,</text><text x="350" y="187" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">triangle 15 m behind</text><text x="350" y="206" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">in town, 30 m outside</text><rect x="466" y="56" width="210" height="180" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="488" cy="78" r="13" fill="#E0A100"/><text x="488" y="83" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text><circle cx="557" cy="87.8" r="9.8" fill="#1F2328"/><path d="M544.4,134 L544.4,111.6 Q544.4,100.4 557,100.4 Q569.6,100.4 569.6,111.6 L569.6,134 z" fill="#1F2328"/><circle cx="597" cy="94" r="15" fill="#E0A100"/><text x="597" y="101" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">?</text><text x="571" y="168" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">Check: is anyone</text><text x="571" y="187" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">hurt or killed?</text><rect x="24" y="248" width="210" height="180" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="46" cy="270" r="13" fill="#E0A100"/><text x="46" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">4</text><rect x="77" y="270" width="40" height="64" rx="7" fill="#1F2328"/><rect x="82" y="278" width="30" height="42" rx="3" fill="#fff"/><text x="97" y="305" font-size="13" font-weight="bold" text-anchor="middle" fill="#D64545">112</text><circle cx="157" cy="300" r="24" fill="#D64545"/><rect x="150" y="285" width="14" height="30" fill="#fff"/><rect x="142" y="293" width="30" height="14" fill="#fff"/><text x="129" y="360" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">First aid · call 112</text><text x="129" y="379" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">(ambulance) and</text><text x="129" y="398" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">tell the police</text><rect x="245" y="248" width="210" height="180" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="267" cy="270" r="13" fill="#E0A100"/><text x="267" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">5</text><rect x="274" y="282" width="46" height="24" rx="5" fill="#2F6FDB" stroke="#fff" stroke-width="1.5"/><rect x="384" y="270" width="42" height="42" rx="6" fill="#2F6FDB"/><text x="405" y="299" font-size="24" font-weight="bold" text-anchor="middle" fill="#fff">H</text><path d="M326,294 L376,294" stroke="#2E9E5B" stroke-width="4" marker-end="url(#ag)"/><path d="M400,318 Q350,340 296,316" fill="none" stroke="#2E9E5B" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ag)"/><text x="350" y="360" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">Urgent hospital?</text><text x="350" y="379" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">Passing vehicle, or</text><text x="350" y="398" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">drive them yourself,</text><text x="350" y="417" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">then come back</text><rect x="466" y="248" width="210" height="180" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="488" cy="270" r="13" fill="#E0A100"/><text x="488" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">6</text><circle cx="537" cy="279.8" r="9.8" fill="#1F2328"/><path d="M524.4,326 L524.4,303.6 Q524.4,292.4 537,292.4 Q549.6,292.4 549.6,303.6 L549.6,326 z" fill="#1F2328"/><rect x="567" y="294" width="56" height="28" rx="5" fill="#8A8F98" stroke="#fff" stroke-width="1.5"/><rect x="587" y="286" width="16" height="8" rx="3" fill="#2F6FDB"/><text x="571" y="360" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">Otherwise stay</text><text x="571" y="379" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">at the scene and</text><text x="571" y="398" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2328">wait for the police</text><rect x="24" y="444" width="652" height="86" rx="8" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="24" y="444" width="8" height="86" rx="3" fill="#2E9E5B"/><rect x="48" y="464" width="32" height="42" rx="3" fill="#fff" stroke="#5B616B" stroke-width="1.5"/><line x1="54" y1="474" x2="74" y2="474" stroke="#5B616B" stroke-width="1.5"/><line x1="54" y1="482" x2="74" y2="482" stroke="#5B616B" stroke-width="1.5"/><line x1="54" y1="490" x2="74" y2="490" stroke="#5B616B" stroke-width="1.5"/><line x1="54" y1="498" x2="74" y2="498" stroke="#5B616B" stroke-width="1.5"/><text x="96" y="470" font-size="15" font-weight="bold" text-anchor="start" fill="#2E9E5B">No one hurt?</text><text x="96" y="494" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">The drivers may agree on what happened,</text><text x="96" y="514" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">draw a sketch together and sign it.</text></svg>