6" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მწვანეზე კონტურის</text><text x="488" y="363" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">ისრები = რა შეიძლება</text><text x="488" y="380" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">(პირდაპირ, მარჯვნივ).</text><text x="488" y="397" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">ჩამქრალი სექცია =</text><text x="488" y="414" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მარცხნივ და მობრუნება</text><text x="488" y="431" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">არა.</text><text x="488" y="480" font-size="12" font-weight="normal" text-anchor="start" fill="#5B616B">ბილეთები #148, #149</text><rect x="24" y="510" width="318" height="224" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="38" y="550" width="32" height="44" rx="7" fill="#2B2F36"/><circle cx="54" cy="572" r="12" fill="#1B1E23"/><polygon points="0,-10 7.5,-1.0 2.8000000000000003,-1.0 2.8000000000000003,10 -2.8000000000000003,10 -2.8000000000000003,-1.0 -7.5,-1.0" fill="#2EBF6B" stroke-linejoin="round" transform="translate(54,572) rotate(270)"/><rect x="74" y="550" width="32" height="44" rx="7" fill="#2B2F36"/><circle cx="90" cy="572" r="12" fill="#1B1E23"/><polygon points="0,-10 7.5,-1.0 2.8000000000000003,-1.0 2.8000000000000003,10 -2.8000000000000003,10 -2.8000000000000003,-1.0 -7.5,-1.0" fill="#E5484D" stroke-linejoin="round" transform="translate(90,572) rotate(0)"/><rect x="110" y="550" width="32" height="44" rx="7" fill="#2B2F36"/><circle cx="126" cy="572" r="12" fill="#1B1E23"/><polygon points="0,-10 7.5,-1.0 2.8000000000000003,-1.0 2.8000000000000003,10 -2.8000000000000003,10 -2.8000000000000003,-1.0 -7.5,-1.0" fill="#2EBF6B" stroke-linejoin="round" transform="translate(126,572) rotate(90)"/><text x="154" y="540" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">ისრის ფორმის</text><text x="154" y="559" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">შუქნიშანი</text><text x="154" y="584" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">ყოველი ისარი მხოლოდ</text><text x="154" y="601" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">თავის მიმართულებაზე</text><text x="154" y="618" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მოქმედებს. მწვანე</text><text x="154" y="635" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მარცხენა ისარი</text><text x="154" y="652" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მობრუნებასაც უშვებს.</text><text x="154" y="718" font-size="12" font-weight="normal" text-anchor="start" fill="#5B616B">ბილეთი #157</text><rect x="358" y="510" width="318" height="224" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="372" y="550" width="52" height="56" rx="7" fill="#2B2F36"/><circle cx="382" cy="563" r="6" fill="#4A4F57"/><circle cx="398" cy="563" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="398" cy="563" r="6" fill="#FFF1B8"/><circle cx="414" cy="563" r="6" fill="#4A4F57"/><circle cx="398" cy="590" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="398" cy="590" r="6" fill="#FFF1B8"/><text x="398" y="624" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2328">წადი</text><rect x="430" y="550" width="52" height="56" rx="7" fill="#2B2F36"/><circle cx="440" cy="563" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="440" cy="563" r="6" fill="#FFF1B8"/><circle cx="456" cy="563" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="456" cy="563" r="6" fill="#FFF1B8"/><circle cx="472" cy="563" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="472" cy="563" r="6" fill="#FFF1B8"/><circle cx="456" cy="590" r="6" fill="#4A4F57"/><text x="456" y="624" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2328">გაჩერდი</text><text x="488" y="540" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">T-სებური შუქნიშანი</text><text x="488" y="559" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">(სამარშრუტო)</text><text x="488" y="584" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">სამარშრუტო თავის</text><text x="488" y="601" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">ზოლში. ქვედა + ზედა</text><text x="488" y="618" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მარცხენა: მარცხნივ,</text><text x="488" y="635" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">შუა: პირდაპირ,</text><text x="488" y="652" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მარჯვენა: მარჯვნივ.</text><text x="488" y="669" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მხოლოდ სამი ზედა:</text><text x="488" y="686" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">გაჩერდი.</text><text x="488" y="718" font-size="12" font-weight="normal" text-anchor="start" fill="#5B616B">ბილეთები #183–185</text><rect x="24" y="748" width="318" height="224" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="58" y="778" width="52" height="100" rx="9" fill="#2B2F36"/><circle cx="84" cy="804" r="24" fill="#E5484D" fill-opacity="0.18"/><circle cx="84" cy="804" r="19" fill="#1B1E23"/><circle cx="84" cy="796" r="3" fill="#E5484D"/><path d="M84,800 L84,808 M84,808 L82,816 M84,808 L86,816 M80,802 L80,808 M88,802 L88,808" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="84" cy="852" r="24" fill="#2EBF6B" fill-opacity="0.18"/><circle cx="84" cy="852" r="19" fill="#1B1E23"/><circle cx="84" cy="844" r="3" fill="#2EBF6B"/><path d="M84,848 L84,856 M84,856 L79,864 M84,856 L89,864 M79,852 L84,849 L89,854" fill="none" stroke="#2EBF6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="154" y="778" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">ქვეითის შუქნიშანი</text><text x="154" y="803" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">წითელი: ნუ გადახვალ.</text><text x="154" y="820" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მწვანე: გადადი.</text><text x="154" y="837" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">ქვეითის შუქნიშანი არ</text><text x="154" y="854" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">არის? გადადი, როცა</text><text x="154" y="871" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მანქანებს წითელი</text><text x="154" y="888" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">აქვთ. წყვეტილი ხმა =</text><text x="154" y="905" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">წითელი, უწყვეტი =</text><text x="154" y="922" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">მწვანე.</text><text x="154" y="956" font-size="12" font-weight="normal" text-anchor="start" fill="#5B616B">კანონი, მუხლი 29(6)</text><rect x="358" y="748" width="318" height="224" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="398" y="776" width="40" height="96" rx="8" fill="#2B2F36"/><circle cx="418" cy="794" r="11" fill="#E5484D" fill-opacity="0.35"/><circle cx="418" cy="824" r="11" fill="#F5B400" fill-opacity="0.35"/><circle cx="418" cy="854" r="16" fill="#2EBF6B" fill-opacity="0.25"/><circle cx="418" cy="854" r="11" fill="#2EBF6B"/><rect x="392" y="880" width="52" height="34" rx="4" fill="#fff" stroke="#1F2328" stroke-width="1.5"/><circle cx="407" cy="902" r="7" fill="none" stroke="#1F2328" stroke-width="2"/><circle cx="429" cy="902" r="7" fill="none" stroke="#1F2328" stroke-width="2"/><path d="M407,902 L414,890 L424,890 L429,902 M414,890 L418,902 L424,890 M412,887 L417,887" fill="none" stroke="#1F2328" stroke-width="2" s