<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1178" viewBox="0 0 700 1178" font-family="Segoe UI, Sylfaen, Noto Sans Georgian, DejaVu Sans, sans-serif"><rect x="1" y="1" width="698" height="1176" rx="14" fill="#FAFAF7" stroke="#D9D9D2" stroke-width="2"/><text x="24" y="36" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2328">განსაკუთრებული შუქნიშნები</text><text x="24" y="60" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">რას აჩვენებს გამოცდა ჩვეულებრივი წითელი, ყვითელი და მწვანის გარდა.</text><rect x="24" y="80" width="652" height="178" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><text x="40" y="108" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">რევერსული შუქნიშანი</text><rect x="40" y="128" width="56" height="56" rx="8" fill="#2B2F36"/><polygon points="0,-17 12.75,-1.7000000000000002 4.760000000000001,-1.7000000000000002 4.760000000000001,17 -4.760000000000001,17 -4.760000000000001,-1.7000000000000002 -12.75,-1.7000000000000002" fill="#2EBF6B" stroke-linejoin="round" transform="translate(68.0,156.0) rotate(180)"/><text x="40" y="208" font-size="14" font-weight="bold" text-anchor="start" fill="#1F2328">ზოლი ღიაა</text><text x="40" y="226" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">იმოძრავე</text><rect x="200" y="128" width="56" height="56" rx="8" fill="#2B2F36"/><line x1="214.0" y1="170.0" x2="242.0" y2="142.0" stroke="#E5484D" stroke-width="6" stroke-linecap="round"/><line x1="214.0" y1="142.0" x2="242.0" y2="170.0" stroke="#E5484D" stroke-width="6" stroke-linecap="round"/><text x="200" y="208" font-size="14" font-weight="bold" text-anchor="start" fill="#1F2328">ზოლი დაკეტილია</text><text x="200" y="226" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">არ იმოძრავო</text><rect x="360" y="128" width="56" height="56" rx="8" fill="#2B2F36"/><polygon points="0,-17 12.75,-1.7000000000000002 4.760000000000001,-1.7000000000000002 4.