anchor="start" fill="#5B616B">შუქნიშანთან</text><rect x="254" y="1032" width="84" height="42" rx="10" fill="#2B2F36"/><circle cx="296" cy="1053" r="18" fill="#F5B400" fill-opacity="0.25"/><circle cx="296" cy="1053" r="13" fill="#F5B400"/><text x="254" y="1110" font-size="14" font-weight="bold" text-anchor="start" fill="#1F2328">მოციმციმე ყვითელი</text><text x="254" y="1128" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">გააგრძელე განსაკუთრებული</text><text x="254" y="1143" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">სიფრთხილით (#155)</text><rect x="468" y="1032" width="84" height="42" rx="10" fill="#2B2F36"/><circle cx="490" cy="1053" r="13" fill="#4A4F57"/><circle cx="530" cy="1053" r="13" fill="#4A4F57"/><text x="468" y="1110" font-size="14" font-weight="bold" text-anchor="start" fill="#1F2328">გამორთულია</text><text x="468" y="1128" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">წადი, თუ მატარებელი არ</text><text x="468" y="1143" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">ჩანს (#180)</text></svg>