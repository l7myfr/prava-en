<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="Segoe UI, Sylfaen, Noto Sans Georgian, DejaVu Sans, sans-serif">
  <rect x="0" y="0" width="700" height="330" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="698" height="328" rx="15" fill="none" stroke="#d6dbe1" stroke-width="2"/>
  <text x="350" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">საცნობი ნიშნები მანქანაზე (წინ და უკან)</text>

  <rect x="40" y="62" width="300" height="236" rx="14" fill="#f8fafc" stroke="#d6dbe1"/>
  <rect x="130" y="78" width="120" height="120" rx="6" fill="#facc15" stroke="#1f2937" stroke-width="2"/>
  <g fill="#111827">
    <circle cx="185" cy="98" r="9"/>
    <path d="M178 110 h12 v26 h22 l10 26 -10 4 -8 -20 h-26 z"/>
    <path d="M176 128 a26 26 0 1 0 34 30 l-8 -3 a18 18 0 1 1 -24 -21 z"/>
  </g>
  <text x="190" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">„შეზღუდული შესაძლებლობის</text>
  <text x="190" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">მქონე პირი“</text>
  <text x="190" y="264" text-anchor="middle" font-size="14" fill="#374151">ყვითელი კვადრატი, 150 მმ, 8.17-ის სიმბოლო</text>
  <text x="190" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#2E9E5B">მძღოლის სურვილისამებრ</text>

  <rect x="360" y="62" width="300" height="236" rx="14" fill="#f8fafc" stroke="#d6dbe1"/>
  <circle cx="510" cy="138" r="60" fill="#facc15" stroke="#1f2937" stroke-width="2"/>
  <g fill="#111827">
    <circle cx="484" cy="122" r="15"/>
    <circle cx="536" cy="122" r="15"/>
    <circle cx="510" cy="166" r="15"/>
  </g>
  <text x="510" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">„სმენადაქვეითებული მძღოლი“</text>
  <text x="510" y="246" text-anchor="middle" font-size="14" fill="#374151">ყვითელი წრე 160 მმ, 3 შავი წრე</text>
  <text x="510" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#D64545">სავალდებულო</text>
</svg>
