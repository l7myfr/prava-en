<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" font-family="Segoe UI, Sylfaen, Noto Sans Georgian, DejaVu Sans, sans-serif"><defs>
<marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E5B"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker>
</defs><rect x="1" y="1" width="698" height="518" rx="14" fill="#FAFAF7" stroke="#D9D9D2" stroke-width="2"/><text x="24" y="36" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2328">First aid: check, then act</text><rect x="24" y="56" width="200" height="86" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="48" cy="82" r="13" fill="#E0A100"/><text x="48" y="87" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="70" y="88" font-size="17" font-weight="bold" text-anchor="start" fill="#1F2328">Conscious?</text><text x="42" y="114" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">talk to them, tap them</text><path d="M227,99 L246,99" stroke="#1F2328" stroke-width="2.5" marker-end="url(#ak)"/><rect x="250" y="56" width="200" height="86" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="274" cy="82" r="13" fill="#E0A100"/><text x="274" y="87" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="296" y="88" font-size="17" font-weight="bold" text-anchor="start" fill="#1F2328">Breathing?</text><text x="268" y="114" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">is the airway open?</text><path d="M453,99 L472,99" stroke="#1F2328" stroke-width="2.5" marker-end="url(#ak)"/><rect x="476" y="56" width="200" height="86" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="500" cy="82" r="13" fill="#E0A100"/><text x="500" y="87" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="522" y="88" font-size="17" font-weight="bold" text-anchor="start" fill="#1F2328">Pulse?</text><text x="494" y="114" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">carotid artery (neck)</text><rect x="24" y="158" width="312" height="142" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="24" y="158" width="8" height="142" rx="3" fill="#D64545"/><text x="48" y="186" font-size="15" font-weight="bold" text-anchor="start" fill="#D64545">No breathing and no pulse</text><text x="48" y="230" font-size="34" font-weight="bold" text-anchor="start" fill="#1F2328">30 + 2</text><text x="48" y="258" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">CPR: 30 chest compressions</text><text x="48" y="277" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">+ 2 rescue breaths</text><rect x="364" y="158" width="312" height="142" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="364" y="158" width="8" height="142" rx="3" fill="#E0A100"/><text x="388" y="186" font-size="15" font-weight="bold" text-anchor="start" fill="#B07F00">No breathing, pulse present</text><text x="388" y="230" font-size="34" font-weight="bold" text-anchor="start" fill="#1F2328">1 breath / 6 s</text><text x="388" y="258" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">rescue breaths only</text><text x="388" y="277" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">check the pulse every 2 min</text><rect x="24" y="316" width="312" height="120" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="60" cy="386" r="10" fill="#1F2328"/><rect x="72" y="376" width="52" height="20" rx="9" fill="#1F2328"/><path d="M122,386 L158,390" stroke="#1F2328" stroke-width="8" stroke-linecap="round"/><path d="M122,384 L142,366 L158,378" fill="none" stroke="#1F2328" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M86,380 L90,398" stroke="#1F2328" stroke-width="7" stroke-linecap="round"/><line x1="40" y1="402" x2="168" y2="402" stroke="#5B616B" stroke-width="2"/><text x="180" y="352" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Unconscious</text><text x="180" y="376" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">(head injury)</text><text x="180" y="395" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">lay them on their side</text><rect x="364" y="316" width="312" height="120" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="460" y="378" width="34" height="22" rx="4" fill="#D7D9DD"/><circle cx="398" cy="390" r="10" fill="#1F2328"/><rect x="410" y="382" width="50" height="16" rx="7" fill="#1F2328"/><path d="M456,390 L498,368" stroke="#1F2328" stroke-width="8" stroke-linecap="round"/><line x1="380" y1="402" x2="508" y2="402" stroke="#5B616B" stroke-width="2"/><text x="520" y="352" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Fainted</text><text x="520" y="376" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">on their back,</text><text x="520" y="395" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">legs raised</text><text x="24" y="466" font-size="15" font-weight="bold" text-anchor="start" fill="#D64545">Never give medicine to an unconscious person.</text><text x="24" y="492" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">Take them out of the car only if no breathing and no pulse, or staying is more dangerous.</text></svg>