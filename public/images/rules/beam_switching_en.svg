<svg xmlns="http://www.w3.org/2000/svg" width="700" height="504" viewBox="0 0 700 504" font-family="Segoe UI, Sylfaen, Noto Sans Georgian, DejaVu Sans, sans-serif"><defs>
<marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E5B"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F4F4F4"/></marker>
</defs><rect x="1" y="1" width="698" height="502" rx="14" fill="#FAFAF7" stroke="#D9D9D2" stroke-width="2"/><text x="24" y="36" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2328">When to switch high beam to low beam</text><rect x="24" y="56" width="652" height="100" rx="8" fill="#5E646E"/><line x1="24" y1="106" x2="676" y2="106" stroke="#F4F4F4" stroke-width="3" stroke-dasharray="22 16"/><path d="M76,124 L560,112 L560,152 L76,140 Z" fill="none" stroke="#FFE27A" stroke-width="2" stroke-dasharray="7 5"/><text x="460" y="137" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFE27A">high beam</text><path d="M76,124 L250,132 L250,150 L76,140 Z" fill="#FFE9A6" opacity="0.95"/><text x="170" y="142" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2328">low beam</text><rect x="40" y="121" width="34" height="20" rx="5" fill="#2F6FDB" stroke="#fff" stroke-width="1.5"/><rect x="600" y="71" width="34" height="20" rx="5" fill="#8A8F98" stroke="#fff" stroke-width="1.5"/><path d="M600,76 L585,74 L585,90 L600,86 Z" fill="#FFE9A6"/><line x1="78" y1="172" x2="598" y2="172" stroke="#1F2328" stroke-width="2" marker-start="url(#ak)" marker-end="url(#ak)"/><rect x="298" y="160" width="82" height="24" rx="6" fill="#FAFAF7"/><text x="339" y="178" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2328">≥ 150 m</text><text x="24" y="210" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Oncoming car 150 m or more away → switch to low beam</text><text x="24" y="232" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">Switch earlier if the other driver flashes to ask.</text><rect x="24" y="252" width="208" height="232" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="24" y="252" width="208" height="8" rx="4" fill="#2E9E5B"/><path d="M54,316 Q128,266 202,316 Z" fill="#CFE3C8" stroke="#2E9E5B" stroke-width="2"/><path d="M90,294 L106,284 L146,290 L146,300 L106,292 Z" fill="#FFE9A6"/><g transform="rotate(-24 80 300)"><rect x="66" y="292" width="28" height="16" rx="4" fill="#2F6FDB" stroke="#fff" stroke-width="1.5"/></g><text x="38" y="348" font-size="15" font-weight="bold" text-anchor="start" fill="#2E9E5B">Hill top at night</text><text x="38" y="372" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">Always switch to low beam.</text><rect x="246" y="252" width="208" height="232" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="246" y="252" width="208" height="8" rx="4" fill="#2F6FDB"/><rect x="310" y="280" width="80" height="30" rx="6" fill="#2F6FDB"/><rect x="318" y="286" width="16" height="11" rx="2" fill="#DCE8F7"/><rect x="342" y="286" width="16" height="11" rx="2" fill="#DCE8F7"/><rect x="366" y="286" width="16" height="11" rx="2" fill="#DCE8F7"/><line x1="294" y1="318" x2="406" y2="318" stroke="#1F2328" stroke-width="3"/><circle cx="322" cy="312" r="4" fill="#1F2328"/><circle cx="341" cy="312" r="4" fill="#1F2328"/><circle cx="360" cy="312" r="4" fill="#1F2328"/><circle cx="379" cy="312" r="4" fill="#1F2328"/><text x="260" y="348" font-size="15" font-weight="bold" text-anchor="start" fill="#2F6FDB">You could dazzle someone</text><text x="260" y="372" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">Including ships or trains on</text><text x="260" y="391" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">a parallel waterway or</text><text x="260" y="410" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">railway.</text><rect x="468" y="252" width="208" height="232" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="468" y="252" width="208" height="8" rx="4" fill="#D64545"/><path d="M538,296 Q572,272 606,296 Q572,320 538,296 Z" fill="#fff" stroke="#1F2328" stroke-width="2.5"/><circle cx="572" cy="296" r="9" fill="#1F2328"/><line x1="558" y1="266" x2="563" y2="276" stroke="#E0A100" stroke-width="3" stroke-linecap="round"/><line x1="572" y1="266" x2="572" y2="276" stroke="#E0A100" stroke-width="3" stroke-linecap="round"/><line x1="586" y1="266" x2="581" y2="276" stroke="#E0A100" stroke-width="3" stroke-linecap="round"/><text x="482" y="348" font-size="15" font-weight="bold" text-anchor="start" fill="#D64545">Dazzled yourself?</text><text x="482" y="372" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">Don't change lane. Slow</text><text x="482" y="391" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">down, stop, hazard lights</text><text x="482" y="410" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">on. Look at the right edge,</text><text x="482" y="429" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">not into the lights.</text></svg>