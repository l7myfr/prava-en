<svg xmlns="http://www.w3.org/2000/svg" width="700" height="882" viewBox="0 0 700 882" font-family="Segoe UI, Sylfaen, Noto Sans Georgian, DejaVu Sans, sans-serif"><rect x="1" y="1" width="698" height="880" rx="14" fill="#FAFAF7" stroke="#D9D9D2" stroke-width="2"/><text x="24" y="36" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2328">Special traffic lights</text><text x="24" y="60" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">What the exam shows besides the normal red, yellow and green.</text><rect x="24" y="80" width="652" height="178" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><text x="40" y="108" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">Reversible-lane lights (over a lane whose direction changes)</text><rect x="40" y="128" width="56" height="56" rx="8" fill="#2B2F36"/><polygon points="0,-17 12.75,-1.7000000000000002 4.760000000000001,-1.7000000000000002 4.760000000000001,17 -4.760000000000001,17 -4.760000000000001,-1.7000000000000002 -12.75,-1.7000000000000002" fill="#2EBF6B" stroke-linejoin="round" transform="translate(68.0,156.0) rotate(180)"/><text x="40" y="208" font-size="14" font-weight="bold" text-anchor="start" fill="#1F2328">Lane open</text><text x="40" y="226" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">drive in it</text><rect x="200" y="128" width="56" height="56" rx="8" fill="#2B2F36"/><line x1="214.0" y1="170.0" x2="242.0" y2="142.0" stroke="#E5484D" stroke-width="6" stroke-linecap="round"/><line x1="214.0" y1="142.0" x2="242.0" y2="170.0" stroke="#E5484D" stroke-width="6" stroke-linecap="round"/><text x="200" y="208" font-size="14" font-weight="bold" text-anchor="start" fill="#1F2328">Lane closed</text><text x="200" y="226" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">don't drive in it</text><rect x="360" y="128" width="56" height="56" rx="8" fill="#2B2F36"/><polygon points="0,-17 12.75,-1.7000000000000002 4.760000000000001,-1.7000000000000002 4.760000000000001,17 -4.760000000000001,17 -4.760000000000001,-1.7000000000000002 -12.75,-1.7000000000000002" fill="#F5B400" stroke-linejoin="round" transform="translate(388.0,156.0) rotate(135)"/><text x="360" y="208" font-size="14" font-weight="bold" text-anchor="start" fill="#1F2328">Changing</text><text x="360" y="226" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">move to the lane it</text><text x="360" y="241" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">points to</text><rect x="520" y="128" width="56" height="56" rx="8" fill="#2B2F36"/><line x1="534.0" y1="170.0" x2="562.0" y2="142.0" stroke="#4A4F57" stroke-width="6" stroke-linecap="round"/><line x1="534.0" y1="142.0" x2="562.0" y2="170.0" stroke="#4A4F57" stroke-width="6" stroke-linecap="round"/><text x="520" y="208" font-size="14" font-weight="bold" text-anchor="start" fill="#1F2328">Switched off</text><text x="520" y="226" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">don't enter the</text><text x="520" y="241" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5B616B">lane</text><text x="556" y="108" font-size="12" font-weight="normal" text-anchor="start" fill="#5B616B">Cards #142–146</text><rect x="24" y="272" width="318" height="224" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="46" y="292" width="42" height="106" rx="8" fill="#2B2F36"/><circle cx="67.0" cy="317" r="19" fill="#E5484D" fill-opacity="0.25"/><circle cx="67.0" cy="317" r="14" fill="#E5484D"/><circle cx="67.0" cy="351" r="14" fill="#4A4F57"/><circle cx="67.0" cy="385" r="14" fill="#4A4F57"/><rect x="92" y="366" width="40" height="40" rx="7" fill="#2B2F36"/><circle cx="112.0" cy="386.0" r="14" fill="#4A4F57"/><circle cx="112.0" cy="386.0" r="19" fill="#2EBF6B" fill-opacity="0.18"/><polygon points="0,-11 8.25,-1.1 3.08,-1.1 3.08,11 -3.08,11 -3.08,-1.1 -8.25,-1.1" fill="#2EBF6B" stroke-linejoin="round" transform="translate(112.0,386.0) rotate(270)"/><text x="154" y="302" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Green arrow, main</text><text x="154" y="321" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">light red</text><text x="154" y="346" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Go that way, but give</text><text x="154" y="363" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">way to everyone from</text><text x="154" y="380" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">other directions, trams</text><text x="154" y="397" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">too.</text><text x="154" y="480" font-size="12" font-weight="normal" text-anchor="start" fill="#5B616B">Cards #105–109</text><rect x="358" y="272" width="318" height="224" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="374" y="366" width="40" height="40" rx="7" fill="#2B2F36"/><circle cx="394.0" cy="386.0" r="14" fill="#4A4F57"/><rect x="420" y="292" width="42" height="106" rx="8" fill="#2B2F36"/><circle cx="441.0" cy="317" r="14" fill="#4A4F57"/><circle cx="441.0" cy="351" r="14" fill="#4A4F57"/><circle cx="441.0" cy="385" r="19" fill="#2EBF6B" fill-opacity="0.25"/><circle cx="441.0" cy="385" r="14" fill="#2EBF6B"/><polygon points="0,-7 5.25,-0.7000000000000001 1.9600000000000002,-0.7000000000000001 1.9600000000000002,7 -1.9600000000000002,7 -1.9600000000000002,-0.7000000000000001 -5.25,-0.7000000000000001" fill="none" stroke="#0E3B22" stroke-width="1.8" stroke-linejoin="round" transform="translate(435.0,385) rotate(0)"/><polygon points="0,-7 5.25,-0.7000000000000001 1.9600000000000002,-0.7000000000000001 1.9600000000000002,7 -1.9600000000000002,7 -1.9600000000000002,-0.7000000000000001 -5.25,-0.7000000000000001" fill="none" stroke="#0E3B22" stroke-width="1.8" stroke-linejoin="round" transform="translate(447.0,385) rotate(90)"/><text x="488" y="302" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Extra section</text><text x="488" y="321" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">switched off</text><text x="488" y="346" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">The outline arrows on</text><text x="488" y="363" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">the green show what's</text><text x="488" y="380" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">allowed (straight,</text><text x="488" y="397" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">right). Dark section =</text><text x="488" y="414" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">left and U-turn closed.</text><text x="488" y="480" font-size="12" font-weight="normal" text-anchor="start" fill="#5B616B">Cards #148, #149</text><rect x="24" y="510" width="318" height="224" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="38" y="550" width="32" height="44" rx="7" fill="#2B2F36"/><circle cx="54" cy="572" r="12" fill="#1B1E23"/><polygon points="0,-10 7.5,-1.0 2.8000000000000003,-1.0 2.8000000000000003,10 -2.8000000000000003,10 -2.8000000000000003,-1.0 -7.5,-1.0" fill="#2EBF6B" stroke-linejoin="round" transform="translate(54,572) rotate(270)"/><rect x="74" y="550" width="32" height="44" rx="7" fill="#2B2F36"/><circle cx="90" cy="572" r="12" fill="#1B1E23"/><polygon points="0,-10 7.5,-1.0 2.8000000000000003,-1.0 2.8000000000000003,10 -2.8000000000000003,10 -2.8000000000000003,-1.0 -7.5,-1.0" fill="#E5484D" stroke-linejoin="round" transform="translate(90,572) rotate(0)"/><rect x="110" y="550" width="32" height="44" rx="7" fill="#2B2F36"/><circle cx="126" cy="572" r="12" fill="#1B1E23"/><polygon points="0,-10 7.5,-1.0 2.8000000000000003,-1.0 2.8000000000000003,10 -2.8000000000000003,10 -2.8000000000000003,-1.0 -7.5,-1.0" fill="#2EBF6B" stroke-linejoin="round" transform="translate(126,572) rotate(90)"/><text x="154" y="540" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Arrow-shaped lights</text><text x="154" y="565" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Each arrow works only</text><text x="154" y="582" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">for its own direction. A</text><text x="154" y="599" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">green left arrow also</text><text x="154" y="616" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">lets you U-turn.</text><text x="154" y="718" font-size="12" font-weight="normal" text-anchor="start" fill="#5B616B">Card #157</text><rect x="358" y="510" width="318" height="224" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="372" y="550" width="52" height="56" rx="7" fill="#2B2F36"/><circle cx="382" cy="563" r="6" fill="#4A4F57"/><circle cx="398" cy="563" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="398" cy="563" r="6" fill="#FFF1B8"/><circle cx="414" cy="563" r="6" fill="#4A4F57"/><circle cx="398" cy="590" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="398" cy="590" r="6" fill="#FFF1B8"/><text x="398" y="624" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2328">go straight</text><rect x="430" y="550" width="52" height="56" rx="7" fill="#2B2F36"/><circle cx="440" cy="563" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="440" cy="563" r="6" fill="#FFF1B8"/><circle cx="456" cy="563" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="456" cy="563" r="6" fill="#FFF1B8"/><circle cx="472" cy="563" r="11" fill="#FFF1B8" fill-opacity="0.25"/><circle cx="472" cy="563" r="6" fill="#FFF1B8"/><circle cx="456" cy="590" r="6" fill="#4A4F57"/><text x="456" y="624" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2328">stop</text><text x="488" y="540" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">T-shaped light</text><text x="488" y="559" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">(buses, trams)</text><text x="488" y="584" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Route vehicles only.</text><text x="488" y="601" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Bottom + a top light: go</text><text x="488" y="618" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">that way. Only the 3 top</text><text x="488" y="635" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">lights: stop.</text><text x="488" y="718" font-size="12" font-weight="normal" text-anchor="start" fill="#5B616B">Cards #183–185</text><rect x="24" y="748" width="652" height="110" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="44" y="778" width="96" height="48" rx="10" fill="#2B2F36"/><circle cx="68" cy="802" r="20" fill="#E5484D" fill-opacity="0.25"/><circle cx="68" cy="802" r="15" fill="#E5484D"/><circle cx="116" cy="802" r="15" fill="#4A4F57"/><path d="M66,838 q26,10 52,0" fill="none" stroke="#5B616B" stroke-width="2"/><path d="M112,834 l6,4 l-7,3" fill="none" stroke="#5B616B" stroke-width="2"/><text x="166" y="788" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2328">Flashing reds: railway crossing, bridge, fire station</text><text x="166" y="812" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Two red lights flashing in turn (or one flashing red) mean</text><text x="166" y="829" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">stop.</text></svg>