</defs><rect x="1" y="1" width="698" height="450" rx="14" fill="#FAFAF7" stroke="#D9D9D2" stroke-width="2"/><text x="24" y="36" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2328">მოცურება: რა ქნა</text><g transform="translate(24,56)"><rect x="0" y="0" width="210" height="190" rx="10" fill="#CFE3C8"/><rect x="75" y="0" width="60" height="190" fill="#5E646E"/><line x1="98" y1="120" x2="98" y2="182" stroke="#1F2328" stroke-width="4" stroke-dasharray="7 5"/><line x1="112" y1="120" x2="112" y2="182" stroke="#1F2328" stroke-width="4" stroke-dasharray="7 5"/><rect x="94" y="80" width="22" height="40" rx="5" fill="#2F6FDB" stroke="#fff" stroke-width="1.5"/><path d="M105,74 L105,34" stroke="#2E9E5B" stroke-width="4" marker-end="url(#ag)"/></g><rect x="129" y="64" width="100" height="26" rx="13" fill="#fff" stroke="#D64545" stroke-width="2"/><text x="179" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#D64545">მუხრუჭი ✕</text><text x="129" y="272" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2328">დამუხრუჭებით</text><text x="129" y="292" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2328">გამოწვეული</text><text x="129" y="322" font-size="15" font-weight="bold" text-anchor="middle" fill="#2E9E5B">შეწყვიტე</text><text x="129" y="342" font-size="15" font-weight="bold" text-anchor="middle" fill="#2E9E5B">დამუხრუჭება</text><g transform="translate(245,56)"><rect x="0" y="0" width="210" height="190" rx="10" fill="#CFE3C8"/><path d="M70,190 L70,120 Q70,45 145,45 L210,45" fill="none" stroke="#5E646E" stroke-width="58"/><g transform="rotate(28 78 104)"><rect x="67" y="84" width="22" height="40" rx="5" fill="#2F6FDB" stroke="#fff" stroke-width="1.5"/></g><path d="M64,132 Q46,132 34,118" fill="none" stroke="#D64545" stroke-width="4" marker-end="url(#ar)"/><path d="M94,80 L112,48" stroke="#2E9E5B" stroke-width="4" marker-end="url(#ag)"/></g><rect x="350" y="64" width="100" height="26" rx="13" fill="#fff" stroke="#2E9E5B" stroke-width="2"/><text x="400" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E9E5B">საწვავი +</text><text x="350" y="272" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2328">წინა წამყვანი,</text><text x="350" y="292" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2328">უკანა ხიდი მოცურდა</text><text x="350" y="322" font-size="15" font-weight="bold" text-anchor="middle" fill="#2E9E5B">ოდნავ მოუმატე</text><text x="350" y="342" font-size="15" font-weight="bold" text-anchor="middle" fill="#2E9E5B">საწვავს, საჭით</text><text x="350" y="362" font-size="15" font-weight="bold" text-anchor="middle" fill="#2E9E5B">გაასწორე</text><g transform="translate(466,56)"><rect x="0" y="0" width="210" height="190" rx="10" fill="#CFE3C8"/><path d="M70,190 L70,120 Q70,45 145,45 L210,45" fill="none" stroke="#5E646E" stroke-width="58"/><g transform="rotate(28 78 104)"><rect x="67" y="84" width="22" height="40" rx="5" fill="#2F6FDB" stroke="#fff" stroke-width="1.5"/></g><path d="M64,132 Q46,132 34,118" fill="none" stroke="#D64545" stroke-width="4" marker-end="url(#ar)"/><path d="M92,78 Q88,56 70,48" fill="none" stroke="#2E9E5B" stroke-width="4" marker-end="url(#ag)"/></g><rect x="571" y="64" width="100" height="26" rx="13" fill="#fff" stroke="#E0A100" stroke-width="2"/><text x="621" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#E0A100">საწვავი −</text><text x="571" y="272" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2328">უკანა წამყვანი,</text><text x="571" y="292" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2328">უკანა ხიდი მოცურდა</text><text x="571" y="322" font-size="15" font-weight="bold" text-anchor="middle" fill="#2E9E5B">ოდნავ მოუკელი</text><text x="571" y="342" font-size="15" font-weight="bold" text-anchor="middle" fill="#2E9E5B">საწვავს, საჭე</text><text x="571" y="362" font-size="15" font-weight="bold" text-anchor="middle" fill="#2E9E5B">მოცურების მხარეს</text><text x="24" y="410" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">მოცურების მხარეს = იქით, საითაც უკანა ნაწილი მიცურავს.</text><text x="24" y="431" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">სველი გზა + მოსახვევში მკვეთრი დამუხრუჭება ან მაღალი სიჩქარე = მოცურება.</text></svg>