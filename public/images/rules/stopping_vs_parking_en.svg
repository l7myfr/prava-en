</defs><rect x="1" y="1" width="698" height="298" rx="14" fill="#FAFAF7" stroke="#D9D9D2" stroke-width="2"/><text x="24" y="36" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2328">Stopping or parking?</text><text x="185" y="94" font-size="22" font-weight="bold" text-anchor="middle" fill="#2F6FDB">Stopping</text><text x="185" y="118" font-size="15" font-weight="normal" text-anchor="middle" fill="#1F2328">up to 5 minutes</text><text x="495" y="94" font-size="22" font-weight="bold" text-anchor="middle" fill="#B88400">Parking</text><text x="495" y="118" font-size="15" font-weight="normal" text-anchor="middle" fill="#1F2328">more than 5 minutes</text><path d="M48,136 L330,136 L330,164 L48,164 Q40,164 40,156 L40,144 Q40,136 48,136 Z" fill="#2F6FDB"/><path d="M330,136 L640,136 L640,128 L666,150 L640,172 L640,164 L330,164 Z" fill="#E0A100"/><line x1="330" y1="128" x2="330" y2="172" stroke="#1F2328" stroke-width="3"/><text x="40" y="192" font-size="15" font-weight="normal" text-anchor="middle" fill="#5B616B">0</text><text x="330" y="192" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2328">5 min</text><rect x="40" y="210" width="620" height="70" rx="10" fill="#EAF1FC" stroke="#2F6FDB" stroke-width="1.5"/><text x="56" y="238" font-size="15" font-weight="bold" text-anchor="start" fill="#2F6FDB">Passengers getting in or out, or loading?</text><text x="56" y="262" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2328">Then it is still stopping, even if it takes longer.</text></svg>