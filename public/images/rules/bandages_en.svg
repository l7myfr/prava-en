<svg xmlns="http://www.w3.org/2000/svg" width="700" height="890" viewBox="0 0 700 890" font-family="Segoe UI, Sylfaen, Noto Sans Georgian, DejaVu Sans, sans-serif"><rect x="1" y="1" width="698" height="888" rx="14" fill="#FAFAF7" stroke="#D9D9D2" stroke-width="2"/><text x="24" y="36" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2328">Bandages: which one goes where</text><text x="24" y="60" font-size="14" font-weight="normal" text-anchor="start" fill="#5B616B">Always start with a sterile pad on the wound, then bandage over it.</text><rect x="24" y="80" width="318" height="186" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="42" y="156" width="100" height="46" rx="23.0" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><polygon points="80,153 104,153 104,205 80,205" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><polygon points="81,154 105,154 105,206 81,206" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><polygon points="82,155 106,155 106,207 82,207" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><text x="164" y="110" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">Circular</text><text x="164" y="134" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Turns on the same spot.</text><text x="164" y="151" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Starts and ends every</text><text x="164" y="168" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">bandage. Wrist,</text><text x="164" y="185" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">forehead, neck.</text><rect x="358" y="80" width="318" height="186" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="376" y="156" width="100" height="46" rx="23.0" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><polygon points="382,153 404,153 416,205 394,205" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><polygon points="397,153 419,153 431,205 409,205" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><polygon points="412,153 434,153 446,205 424,205" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><polygon points="427,153 449,153 461,205 439,205" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><polygon points="442,153 464,153 476,205 454,205" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><text x="498" y="110" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">Spiral</text><text x="498" y="134" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Each turn covers half</text><text x="498" y="151" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">of the one before. Arm</text><text x="498" y="168" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">or leg, chest.</text><rect x="24" y="280" width="318" height="186" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="72" y="302" width="36" height="116" rx="16" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><path d="M72,402 L72,438 L140,438 Q148,424 136,418 L108,406 Z" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><line x1="70" y1="382" x2="110" y2="382" stroke="#7D838C" stroke-width="13" stroke-linecap="round"/><line x1="70" y1="382" x2="110" y2="382" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/><line x1="74" y1="390" x2="132" y2="432" stroke="#7D838C" stroke-width="13" stroke-linecap="round"/><line x1="74" y1="390" x2="132" y2="432" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/><line x1="108" y1="390" x2="78" y2="434" stroke="#7D838C" stroke-width="13" stroke-linecap="round"/><line x1="108" y1="390" x2="78" y2="434" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/><line x1="82" y1="434" x2="132" y2="426" stroke="#7D838C" stroke-width="13" stroke-linecap="round"/><line x1="82" y1="434" x2="132" y2="426" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/><text x="164" y="310" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">Figure-of-eight</text><text x="164" y="334" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Crosses like an 8 over</text><text x="164" y="351" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">a joint: ankle, wrist,</text><text x="164" y="368" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">knee, elbow.</text><rect x="164" y="432" width="116.8" height="22" rx="11" fill="#2E9E5B"/><text x="173" y="448" font-size="12.5" font-weight="bold" text-anchor="start" fill="#fff">Exam: ankle ✓</text><rect x="358" y="280" width="318" height="186" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><path d="M374,328 Q426,306 458,332 L470,438 L428,438 L418,368 Q396,356 374,360 Z" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><line x1="416" y1="344" x2="442" y2="362" stroke="#7D838C" stroke-width="11" stroke-linecap="round"/><line x1="416" y1="344" x2="442" y2="362" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><line x1="442" y1="362" x2="468" y2="342" stroke="#7D838C" stroke-width="11" stroke-linecap="round"/><line x1="442" y1="362" x2="468" y2="342" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><line x1="418" y1="364" x2="444" y2="382" stroke="#7D838C" stroke-width="11" stroke-linecap="round"/><line x1="418" y1="364" x2="444" y2="382" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><line x1="444" y1="382" x2="469" y2="362" stroke="#7D838C" stroke-width="11" stroke-linecap="round"/><line x1="444" y1="382" x2="469" y2="362" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><line x1="420" y1="384" x2="446" y2="402" stroke="#7D838C" stroke-width="11" stroke-linecap="round"/><line x1="420" y1="384" x2="446" y2="402" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><line x1="446" y1="402" x2="470" y2="382" stroke="#7D838C" stroke-width="11" stroke-linecap="round"/><line x1="446" y1="402" x2="470" y2="382" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><line x1="422" y1="404" x2="448" y2="422" stroke="#7D838C" stroke-width="11" stroke-linecap="round"/><line x1="422" y1="404" x2="448" y2="422" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><line x1="448" y1="422" x2="471" y2="402" stroke="#7D838C" stroke-width="11" stroke-linecap="round"/><line x1="448" y1="422" x2="471" y2="402" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><text x="498" y="310" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">Spica</text><text x="498" y="334" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Stacked V's like an ear</text><text x="498" y="351" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">of wheat. Shoulder,</text><text x="498" y="368" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">hip, thumb.</text><rect x="498" y="432" width="116.8" height="22" rx="11" fill="#D64545"/><text x="507" y="448" font-size="12.5" font-weight="bold" text-anchor="start" fill="#fff">Exam: ankle ✗</text><rect x="24" y="480" width="318" height="186" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="92" cy="576" r="48" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><circle cx="76" cy="562" r="4" fill="#1F2328"/><circle cx="108" cy="562" r="4" fill="#1F2328"/><path d="M84,606 Q92,612 100,606" fill="none" stroke="#C99A7E" stroke-width="2"/><line x1="66" y1="578" x2="36" y2="554" stroke="#7D838C" stroke-width="10" stroke-linecap="round"/><line x1="66" y1="578" x2="36" y2="554" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><line x1="66" y1="590" x2="36" y2="614" stroke="#7D838C" stroke-width="10" stroke-linecap="round"/><line x1="66" y1="590" x2="36" y2="614" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><line x1="118" y1="578" x2="148" y2="554" stroke="#7D838C" stroke-width="10" stroke-linecap="round"/><line x1="118" y1="578" x2="148" y2="554" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><line x1="118" y1="590" x2="148" y2="614" stroke="#7D838C" stroke-width="10" stroke-linecap="round"/><line x1="118" y1="590" x2="148" y2="614" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><polygon points="66,574 118,574 118,594 66,594" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><text x="164" y="510" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">Sling-type</text><text x="164" y="534" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">One strip with 4 tails,</text><text x="164" y="551" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">tied at the back of the</text><text x="164" y="568" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">head. Nose, chin.</text><rect x="164" y="632" width="116.8" height="22" rx="11" fill="#D64545"/><text x="173" y="648" font-size="12.5" font-weight="bold" text-anchor="start" fill="#fff">Exam: ankle ✗</text><rect x="358" y="480" width="318" height="186" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="376" y="556" width="100" height="46" rx="23.0" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><rect x="412" y="560" width="28" height="38" rx="4" fill="#DCEBFA" stroke="#5B8BC9" stroke-width="2"/><polygon points="406,554 420,554 420,604 406,604" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><polygon points="417,554 431,554 431,604 417,604" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><polygon points="428,554 442,554 442,604 428,604" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><polygon points="439,554 453,554 453,604 439,604" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><path d="M426,514 L426,542" stroke="#1F2328" stroke-width="3"/><path d="M418,534 L426,546 L434,534" fill="none" stroke="#1F2328" stroke-width="3"/><path d="M458,610 q4,8 0,12 q-4,-4 0,-12 z" fill="#8B1E1E"/><text x="498" y="510" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">Pressure bandage</text><text x="498" y="534" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Pad, then tight turns</text><text x="498" y="551" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">right on the wound.</text><text x="498" y="568" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Venous bleeding, head</text><text x="498" y="585" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">wound in the hair.</text><rect x="24" y="680" width="318" height="186" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><circle cx="92" cy="720" r="17" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><rect x="54" y="740" width="76" height="110" rx="18" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><path d="M58,750 L54,810 L120,794" fill="none" stroke="#C99A7E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M58,750 L54,810 L120,794" fill="none" stroke="#F4D9C6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polygon points="80,738 104,738 130,798 52,822" fill="#FFFFFF" stroke="#7D838C" stroke-width="1.5" stroke-linejoin="round"/><line x1="82" y1="738" x2="102" y2="738" stroke="#7D838C" stroke-width="9" stroke-linecap="round"/><line x1="82" y1="738" x2="102" y2="738" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><text x="164" y="710" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">Arm sling</text><text x="164" y="734" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Broken arm, no splint:</text><text x="164" y="751" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">elbow bent, hung from</text><text x="164" y="768" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">the neck, bandaged to</text><text x="164" y="785" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">the body.</text><rect x="358" y="680" width="318" height="186" rx="10" fill="#fff" stroke="#D9D9D2" stroke-width="2"/><rect x="376" y="756" width="100" height="46" rx="23.0" fill="#F4D9C6" stroke="#C99A7E" stroke-width="2"/><rect x="402" y="752" width="12" height="54" rx="3" fill="#3A3F47"/><rect x="386" y="716" width="46" height="24" rx="5" fill="#fff" stroke="#1F2328" stroke-width="1.5"/><text x="409" y="733" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F2328">14:35</text><line x1="408" y1="740" x2="408" y2="752" stroke="#1F2328" stroke-width="1.5"/><ellipse cx="452" cy="778" rx="7" ry="10" fill="#D64545"/><line x1="458" y1="776" x2="468" y2="760" stroke="#D64545" stroke-width="3" stroke-linecap="round"/><line x1="458" y1="776" x2="474" y2="770" stroke="#D64545" stroke-width="3" stroke-linecap="round"/><line x1="458" y1="776" x2="472" y2="784" stroke="#D64545" stroke-width="3" stroke-linecap="round"/><text x="498" y="710" font-size="16" font-weight="bold" text-anchor="start" fill="#1F2328">Tourniquet</text><text x="498" y="734" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">Bright red, spurting</text><text x="498" y="751" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">blood. Above the wound,</text><text x="498" y="768" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">on one bone. Write the</text><text x="498" y="785" font-size="13" font-weight="normal" text-anchor="start" fill="#5B616B">time.</text></svg>